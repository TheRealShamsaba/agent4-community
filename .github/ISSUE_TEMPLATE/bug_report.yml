name: Report a bug
description: Help make Agent4 work better for small teams.
body:
  - type: markdown
    attributes:
      value: Use fictional data. Do not post credentials, setup/invite links, private company information or database files. Report vulnerabilities through SECURITY.md.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Explain the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
  - type: dropdown
    id: install
    attributes:
      label: Installation
      options: [Docker Compose, Native Node, Other]
  - type: textarea
    id: evidence
    attributes:
      label: Logs or screenshots
      description: Redact all personal information, credentials and client data first.
